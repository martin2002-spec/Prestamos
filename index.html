<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Préstamos y Pagaré</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1, h2, h3, h4 {
            color: #1e3a8a;
            text-align: center;
            margin-top: 0;
        }
        .section-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .btn-success {
            background-color: #16a34a;
            margin-top: 10px;
        }
        .btn-success:hover {
            background-color: #15803d;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #eff6ff;
            color: #1e3a8a;
        }
        tr:nth-child(even) {
            background-color: #f9fafb;
        }
        .summary-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }
        .summary-box p {
            margin: 5px 0;
            font-size: 15px;
        }
        
        /* Contrato y Pagaré */
        #documentoContainer {
            display: none;
            margin-top: 30px;
            border: 2px dashed #cbd5e1;
            padding: 25px;
            background: #ffffff;
            border-radius: 8px;
        }
        .legal-text {
            font-size: 13px;
            line-height: 1.6;
            text-align: justify;
        }
        .signatures-area {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            page-break-inside: avoid;
        }
        .signature-box {
            width: 42%;
            text-align: center;
        }
        .signature-line {
            border-top: 1px solid #000;
            margin-top: 40px;
            padding-top: 5px;
            font-size: 13px;
        }
        .digital-sig {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            color: #1e3a8a;
            height: 40px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* CONFIGURACIÓN ESTRICTA PARA IMPRESIÓN/PDF */
        @media print {
            @page {
                size: letter;
                margin: 0mm;
            }
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .container > *:not(#documentoContainer) {
                display: none !important;
            }
            #documentoContainer {
                display: block !important;
                border: none !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 15mm !important;
                width: 100% !important;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora de Préstamos y Pagaré</h1>

    <div class="section-box">
        <h3>Datos del Préstamo</h3>
        <label for="deudor">Nombre del Deudor (A quien se le presta):</label>
        <input type="text" id="deudor" placeholder="Ej. Juan Pérez">

        <label for="acreedor">Nombre del Acreedor (Tú):</label>
        <input type="text" id="acreedor" placeholder="Ej. Carlos Gómez">

        <label for="monto">Monto del Préstamo ($):</label>
        <input type="number" id="monto" value="5000" min="1">

        <label for="plazo">Plazo (Semanas):</label>
        <input type="number" id="plazo" value="12" min="1">

        <label for="interes">Tasa de Interés Total sobre el Capital (%):</label>
        <input type="number" id="interes" value="15" step="0.1">

        <label for="mora">Interés Moratorio Diario ($ por día de atraso):</label>
        <input type="number" id="mora" value="10">

        <label for="fecha">Fecha de Inicio:</label>
        <input type="date" id="fecha">

        <button onclick="calcular()">Calcular Préstamo</button>
    </div>

    <div id="resultadoContainer" style="display:none;">
        <div class="section-box">
            <h3>Desglose de Pagos</h3>
            <div id="resumenValores" class="summary-box"></div>
            
            <div style="overflow-x:auto;">
                <table id="tablaPagos">
                    <thead>
                        <tr>
                            <th>Pago #</th>
                            <th>Fecha Estimada</th>
                            <th>Capital</th>
                            <th>Interés</th>
                            <th>Pago Semanal</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>

            <button onclick="generarAcuerdo()" class="btn-success">Generar Acuerdo de Mutuo y Pagaré</button>
            <button onclick="guardarEnGoogleSheets()" style="background-color: #0d9488; margin-top: 10px;">Guardar Préstamo en Google Sheets</button>
        </div>
    </div>

    <div id="documentoContainer">
        <div id="textoAcuerdo"></div>
        <div style="text-align: center; margin-top: 30px;" class="no-print">
            <button onclick="window.print()" style="background-color: #4f46e5; width: auto; padding: 10px 30px;">Imprimir / Guardar como PDF</button>
        </div>
    </div>
</div>

<script>
    // Asignar fecha actual por defecto
    document.getElementById('fecha').valueAsDate = new Date();

    let datosGlobales = {};

    function calcular() {
        const deudor = document.getElementById('deudor').value.trim() || "EL DEUDOR";
        const acreedor = document.getElementById('acreedor').value.trim() || "EL ACREEDOR";
        const monto = parseFloat(document.getElementById('monto').value) || 0;
        const plazo = parseInt(document.getElementById('plazo').value) || 1;
        const tasaInteresTotal = parseFloat(document.getElementById('interes').value) || 0;
        const mora = parseFloat(document.getElementById('mora').value) || 0;
        const fechaInicioVal = document.getElementById('fecha').value;

        if (monto <= 0 || plazo <= 0) {
            alert("Por favor, ingresa un monto y un plazo válidos.");
            return;
        }

        const interesTotalMonto = monto * (tasaInteresTotal / 100);
        const totalPagar = monto + interesTotalMonto;
        
        const capitalSemanal = monto / plazo;
        const interesSemanal = interesTotalMonto / plazo;
        const pagoSemanal = totalPagar / plazo;

        let cuerpoTabla = "";
        let fechaBase = fechaInicioVal ? new Date(fechaInicioVal + 'T00:00:00') : new Date();

        for (let i = 1; i <= plazo; i++) {
            fechaBase.setDate(fechaBase.getDate() + 7);
            const fechaStr = fechaBase.toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' });

            cuerpoTabla += `
                <tr>
                    <td>${i}</td>
                    <td>${fechaStr}</td>
                    <td>$${capitalSemanal.toFixed(2)}</td>
                    <td>$${interesSemanal.toFixed(2)}</td>
                    <td><strong>$${pagoSemanal.toFixed(2)}</strong></td>
                </tr>
            `;
        }

        document.getElementById('cuerpoTabla').innerHTML = cuerpoTabla;
        
        document.getElementById('resumenValores').innerHTML = `
            <p><strong>Monto Prestado:</strong> $${monto.toFixed(2)} MXN</p>
            <p><strong>Interés Total (${tasaInteresTotal}%):</strong> $${interesTotalMonto.toFixed(2)} MXN</p>
            <p><strong>Total a Pagar:</strong> $${totalPagar.toFixed(2)} MXN</p>
            <p><strong>Pago Semanal Fijo:</strong> $${pagoSemanal.toFixed(2)} MXN</p>
        `;

        document.getElementById('resultadoContainer').style.display = 'block';

        // Guardar para uso del contrato y base de datos
        datosGlobales = {
            deudor,
            acreedor,
            monto,
            plazo,
            tasaInteresTotal,
            interesTotalMonto,
            totalPagar,
            pagoSemanal,
            mora,
            fechaInicio: fechaInicioVal
        };
    }

    function generarAcuerdo() {
        const d = datosGlobales;
        if (!d.monto) {
            calcular();
        }

        const fechaActual = new Date().toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' });
        
        const htmlFirmaAcreedor = `<div class="digital-sig">${d.acreedor}</div>`;
        const htmlFirmaDeudor = `<div class="digital-sig">${d.deudor}</div>`;

        const htmlContrato = `
            <h2>CONTRATO DE MUTUO CON INTERÉS Y PAGARÉ</h2>
            <p style="text-align: right; font-size: 12px;">Fecha de emisión: ${fechaActual}</p>
            
            <div class="legal-text">
                <p><strong>DECLARACIONES Y CLÁUSULAS:</strong></p>
                <p>1. El C. <strong>${d.acreedor}</strong> (en lo sucesivo "EL ACREEDOR") otorga en este acto un préstamo en efectivo bajo la modalidad de Mutuo con Interés por la cantidad de <strong>$${d.monto.toFixed(2)} MXN</strong> al C. <strong>${d.deudor}</strong> (en lo sucesivo "EL DEUDOR").</p>
                
                <p>2. "EL DEUDOR" se compromete formalmente a restituir dicha cantidad mediante <strong>${d.plazo} pagos semanales consecutivos</strong> de <strong>$${d.pagoSemanal.toFixed(2)} MXN</strong> cada uno, los cuales ya incluyen el rendimiento pactado por un interés total del ${d.tasaInteresTotal}%, dando un total global a liquidar de <strong>$${d.totalPagar.toFixed(2)} MXN</strong>.</p>
                
                <p>3. <strong>PENA CONVENCIONAL / MORA:</strong> En caso de retraso en cualquiera de los pagos semanales establecidos, "EL DEUDOR" pagará a "EL ACREEDOR" un interés moratorio diario de <strong>$${d.mora} MXN</strong> por cada día natural de atraso, de conformidad con lo estipulado entre las partes.</p>
                
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">
                
                <h3 style="text-align: center; margin-bottom: 5px;">PAGARÉ</h3>
                <p style="text-align: center; font-size: 12px;">Buena por: $${d.totalPagar.toFixed(2)} MXN</p>
                
                <p>Por este Pagaré, "EL DEUDOR" <strong>${d.deudor}</strong> promete pagar incondicionalmente a la orden de <strong>${d.acreedor}</strong>, el día de vencimiento final, la cantidad total de <strong>$${d.totalPagar.toFixed(2)} MXN</strong>.</p>
                
                <p>Este pagaré causa un interés moratorio a razón de <strong>$${d.mora} MXN diarios</strong> en caso de mora. Este documento forma parte de un Contrato de Mutuo y su cumplimiento es exigible legalmente.</p>
            </div>

            <div class="signatures-area">
                <div class="signature-box">
                    ${htmlFirmaAcreedor}
                    <div class="signature-line">
                        <strong>${d.acreedor}</strong><br>
                        EL ACREEDOR
                    </div>
                </div>
                <div class="signature-box">
                    ${htmlFirmaDeudor}
                    <div class="signature-line">
                        <strong>${d.deudor}</strong><br>
                        EL DEUDOR
                    </div>
                </div>
            </div>
        `;

        document.getElementById('textoAcuerdo').innerHTML = htmlContrato;
        document.getElementById('documentoContainer').style.display = 'block';
        document.getElementById('documentoContainer').scrollIntoView({ behavior: 'smooth' });
    }

    function guardarEnGoogleSheets() {
        const d = datosGlobales;
        if (!d.monto) {
            calcular();
        }

        const urlWebApps = "https://script.google.com/macros/s/AKfycbx6Sc1OYW5_Psc0yGrH9aAcZwHOHaHFrva58d8KcVf1pDcloJC8nqXt7_iD-EiAaL2_6w/exec";

        const datosEnvio = {
            deudor: d.deudor,
            acreedor: d.acreedor,
            monto: d.monto,
            plazo: d.plazo,
            interesTotal: d.interesTotalMonto,
            totalPagar: d.totalPagar,
            pagoSemanal: d.pagoSemanal,
            fechaInicio: d.fechaInicio
        };

        fetch(urlWebApps, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datosEnvio)
        })
        .then(() => {
            alert("¡Préstamo guardado exitosamente en tu Google Sheets!");
        })
        .catch(error => {
            console.error("Error:", error);
            alert("Hubo un error al intentar guardar en Google Sheets.");
        });
    }

    // Ejecutar cálculo inicial
    calcular();
</script>

</body>
</html>
